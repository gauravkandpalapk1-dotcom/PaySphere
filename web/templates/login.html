<section class="card narrow">
  <h1>Log in</h1>
  <p class="muted">Use your email or your UPI ID.</p>

  <form method="post" action="/login" autocomplete="off">
    <input type="hidden" name="csrf" value="{{csrf}}">

    <label for="identifier">Email or UPI ID</label>
    <input id="identifier" name="identifier" value="{{identifier}}" maxlength="100" required autofocus>

    <label for="password">Password</label>
    <input id="password" type="password" name="password" maxlength="128" required>

    <button type="submit" class="button primary">Log in</button>
  </form>

  <p class="muted small">New to PaySphere? <a href="/register">Create an account</a></p>
</section>
