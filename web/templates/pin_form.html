<h2>Set your UPI PIN</h2>
<p class="muted">You need a UPI PIN before you can pay anyone.</p>
<form method="post" action="/pin" autocomplete="off">
  <input type="hidden" name="csrf" value="{{csrf}}">

  <label for="new_pin">New UPI PIN</label>
  <input id="new_pin" type="password" name="pin" inputmode="numeric" minlength="4" maxlength="6" required>
  <p class="hint">4 or 6 digits. Not repeated digits (1111) or a sequence (1234).</p>

  <label for="confirm_pin">Confirm UPI PIN</label>
  <input id="confirm_pin" type="password" name="confirm" inputmode="numeric" minlength="4" maxlength="6" required>

  <button type="submit" class="button primary">Set PIN</button>
</form>
